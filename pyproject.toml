[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hisinone-cli"
version = "0.1.0"
description = "HISinOne-Campusportale im Terminal: Vorlesungsverzeichnis, Stundenplan und Leistungen"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "smlfg", email = "186922365+smlfg@users.noreply.github.com" },
]
keywords = ["hisinone", "campus", "university", "cli"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
hisinone = "hisinone.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
